[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homingpigeondev"
version = "0.1.0"
description = "Homing Pigeon (homingpigeon.dev) sends text-message alerts from your code or your coding agent to one phone: yours. No carrier registration, no app, no browser signup. Free to start."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
keywords = ["sms", "text message", "alerts", "notifications", "trading bot", "cron", "coding agent", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Communications :: Telephony",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://homingpigeon.dev"
Documentation = "https://homingpigeon.dev/llms.txt"
Source = "https://github.com/homingpigeondev/homingpigeondev/tree/main/python"

[tool.setuptools.packages.find]
where = ["src"]
